# Sabatina's HTTP server (leotsgo/resume-app, `app serve`). The image is built and pushed by
# that repo's deploy workflow, which bumps the tag in the staging overlay; its promote workflow
# bumps prod. Flux ships it. The init container applies the migrations; serve becomes Ready on
# /readyz. Secrets live outside git (Vaultwarden sync), like every other app:
# - sabatina-env: SESSION_PEPPER, RESEND_API_KEY, RESUME_LLM_API_KEY, S3_ENDPOINT, S3_REGION,
#   S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY, S3_BUCKET (optional ANTHROPIC_API_KEY, LLM_PRICES)
# - sabatina-db: key `password`, shared with the CNPG managed role (URL-safe: it is spliced
#   into DATABASE_URL below). The staging overlay points at sabatina-staging-db instead.
# - ghcr-pull: docker-registry secret for the private GHCR image (the cluster's shared item,
#   with sabatina and sabatina-staging in its namespaces)
# Non-secret settings are the overlay's sabatina-config ConfigMap.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sabatina-serve
  labels:
    app.kubernetes.io/name: sabatina
    app.kubernetes.io/component: serve
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sabatina
      app.kubernetes.io/component: serve
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sabatina
        app.kubernetes.io/component: serve
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      # shutdown budget of serve is ~23 s
      terminationGracePeriodSeconds: 30
      # the image is x86_64-only (pinned typst asset)
      nodeSelector:
        kubernetes.io/arch: amd64
      # no pod talks to the Kubernetes API
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: resume-app
          args: ["migrate"]
          envFrom:
            - configMapRef:
                name: sabatina-config
            - secretRef:
                name: sabatina-env
          env:
            - name: DB_USER
              value: sabatina
            - name: DB_NAME
              value: sabatina
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sabatina-db
                  key: password
            - name: DATABASE_URL
              value: postgres://$(DB_USER):$(DB_PASSWORD)@homelab-rw.databases.svc.cluster.local:5432/$(DB_NAME)?sslmode=require
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      containers:
        - name: serve
          image: resume-app
          args: ["serve"]
          ports:
            - name: http
              containerPort: 7322
          envFrom:
            - configMapRef:
                name: sabatina-config
            - secretRef:
                name: sabatina-env
          env:
            - name: DB_USER
              value: sabatina
            - name: DB_NAME
              value: sabatina
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sabatina-db
                  key: password
            - name: DATABASE_URL
              value: postgres://$(DB_USER):$(DB_PASSWORD)@homelab-rw.databases.svc.cluster.local:5432/$(DB_NAME)?sslmode=require
          livenessProbe:
            httpGet:
              path: /status
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # typst and pdftotext write temp dirs
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: sabatina-serve
  labels:
    app.kubernetes.io/name: sabatina
    app.kubernetes.io/component: serve
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sabatina
    app.kubernetes.io/component: serve
  ports:
    - name: http
      port: 7322
      targetPort: http
