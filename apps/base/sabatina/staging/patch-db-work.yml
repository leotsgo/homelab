# The worker's copy of patch-db-serve.yml: the staging role, database and password secret.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sabatina-work
spec:
  template:
    spec:
      containers:
        - name: work
          env:
            - name: DB_USER
              value: sabatina_staging
            - name: DB_NAME
              value: sabatina_staging
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sabatina-staging-db
                  key: password
