# Staging uses its own role and database (sabatina_staging) and the Vaultwarden-synced secret
# sabatina-staging-db (key `password`, synced to ns databases for the CNPG managed role and
# here for the app). Strategic merge by env name: the base keeps its order, so DATABASE_URL
# still sees DB_USER, DB_NAME and DB_PASSWORD defined before it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sabatina-serve
spec:
  template:
    spec:
      initContainers:
        - name: migrate
          env:
            - name: DB_USER
              value: sabatina_staging
            - name: DB_NAME
              value: sabatina_staging
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sabatina-staging-db
                  key: password
      containers:
        - name: serve
          env:
            - name: DB_USER
              value: sabatina_staging
            - name: DB_NAME
              value: sabatina_staging
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sabatina-staging-db
                  key: password
