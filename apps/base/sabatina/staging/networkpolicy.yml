# Only Traefik (the shared Gateway) reaches serve: another pod on the cluster cannot call it
# directly. k3s enforces NetworkPolicy (kube-router).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sabatina-serve-ingress
  labels:
    app.kubernetes.io/name: sabatina
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sabatina
      app.kubernetes.io/component: serve
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 7322
