# LAN/tailnet access through the shared Gateway (wildcard *.leotsgo.dev cert). The name
# resolves to hephaestus through the AdGuard rewrite and the headscale extra record; it does
# not exist in public DNS. The house security-header set rides on top of the app's own CSP.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: sabatina-security-headers
spec:
  headers:
    browserXssFilter: true
    contentTypeNosniff: true
    forceSTSHeader: true
    stsIncludeSubdomains: true
    stsPreload: true
    stsSeconds: 31536000
    customFrameOptionsValue: "SAMEORIGIN"
    referrerPolicy: "strict-origin-when-cross-origin"
    permissionsPolicy: "camera=(), microphone=(), geolocation=()"
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sabatina
spec:
  parentRefs:
    - name: homelab
      namespace: gateway
  hostnames:
    - sabatina.leotsgo.dev
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: sabatina-security-headers
      backendRefs:
        - name: sabatina-serve
          port: 7322
