# Tunnel-only exposure: serve accepts traffic only from the cluster-wide cloudflared pods
# (ns cloudflare), so CF-Connecting-IP (TRUST_PROXY=true) cannot be forged from elsewhere in
# the cluster or from the LAN. k3s enforces NetworkPolicy (kube-router).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sabatina-serve-ingress
  labels:
    app.kubernetes.io/name: sabatina
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sabatina
      app.kubernetes.io/component: serve
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudflare
          podSelector:
            matchLabels:
              app: cloudflared
      ports:
        - protocol: TCP
          port: 7322
