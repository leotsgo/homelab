# Sabatina (leotsgo/resume-app), one environment on this cluster:
#   prod/   ns sabatina, sabatina.app through the cluster-wide Cloudflare tunnel. The app's
#           deploy workflow bumps its tag on every push to main (what is not for everyone yet
#           sits behind a feature flag there); its promote workflow pins an older tag (the
#           rollback). Staging (ns sabatina-staging, sabatina.leotsgo.dev) was retired on
#           2026-10-25.
# base/ holds the Deployments. Secrets come from Vaultwarden (see base/serve.yml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - prod
