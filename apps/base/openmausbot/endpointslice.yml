apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: openmausbot-host
  namespace: ai
  labels:
    kubernetes.io/service-name: openmausbot
    endpointslice.kubernetes.io/managed-by: flux
addressType: IPv4
ports:
  - name: http
    port: 18799
    protocol: TCP
endpoints:
  - addresses: ["192.168.50.10"]
    # Traefik 3.x skips endpoints without an explicit ready=true ("no available
    # server"); nothing probes a hand-written slice, so it is set here.
    conditions:
      ready: true
