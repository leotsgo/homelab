# The blog (leotsgo/blog): Hugo build served by nginx. The image is public and
# built by that repo's deploy workflow, which bumps the tag here; Flux ships it.
# Posts are edited through Sveltia CMS at /admin, which commits to the blog repo
# and so triggers the same workflow. No secrets.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog
  namespace: blog
  labels:
    app: blog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blog
  template:
    metadata:
      labels:
        app: blog
    spec:
      containers:
        - name: blog
          image: ghcr.io/leotsgo/blog:sha-00cc4c4
          resources:
            requests:
              memory: 16Mi
              cpu: 10m
            limits:
              memory: 128Mi
              cpu: 200m
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
