# LAN/tailnet access through the shared gateway. Public traffic skips this: the
# Cloudflare tunnel points at blog.blog.svc.cluster.local:80 directly, so the
# security headers are set by nginx in the image, not by a Traefik Middleware.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: blog
  namespace: blog
spec:
  parentRefs:
    - name: homelab
      namespace: gateway
  hostnames:
    - www.leotsgo.dev
  rules:
    - backendRefs:
        - name: blog
          port: 80
