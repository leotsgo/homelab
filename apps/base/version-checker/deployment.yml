apiVersion: apps/v1
kind: Deployment
metadata:
  name: version-checker
  labels:
    app: version-checker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: version-checker
  template:
    metadata:
      labels:
        app: version-checker
    spec:
      serviceAccountName: version-checker
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: version-checker
          image: quay.io/jetstack/version-checker:v0.11.0
          args:
            # check every running container image, not only annotated ones
            - --test-all-containers=true
            - --metrics-serving-address=0.0.0.0:8080
            - --image-cache-timeout=30m
            - --log-level=info
          ports:
            - name: metrics
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 192Mi
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
