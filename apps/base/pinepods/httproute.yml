# Gateway API HTTPRoute for Pinepods. Same model as immich: a Middleware with the
# house security-header set (contentSecurityPolicy deliberately OMITTED — Pinepods'
# UI loads scripts/styles dynamically and breaks under a restrictive CSP), attached
# to the shared gateway/homelab Gateway. TLS is the gateway's wildcard *.leotsgo.dev cert.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: pinepods-security-headers
  namespace: pinepods
spec:
  headers:
    browserXssFilter: true
    contentTypeNosniff: true
    forceSTSHeader: true
    stsIncludeSubdomains: true
    stsPreload: true
    stsSeconds: 31536000
    customFrameOptionsValue: "SAMEORIGIN"
    referrerPolicy: "strict-origin-when-cross-origin"
    permissionsPolicy: "camera=(), microphone=(), geolocation=()"
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pinepods
  namespace: pinepods
spec:
  parentRefs:
    - name: homelab
      namespace: gateway
  hostnames:
    - pinepods.leotsgo.dev
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: pinepods-security-headers
      backendRefs:
        - name: pinepods
          port: 8040
