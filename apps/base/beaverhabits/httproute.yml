apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: beaverhabits-security-headers
  namespace: beaverhabits
spec:
  headers:
    browserXssFilter: true
    contentTypeNosniff: true
    forceSTSHeader: true
    stsIncludeSubdomains: true
    stsPreload: true
    stsSeconds: 31536000
    customFrameOptionsValue: "SAMEORIGIN"
    contentSecurityPolicy: "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'"
    referrerPolicy: "strict-origin-when-cross-origin"
    permissionsPolicy: "camera=(), microphone=(), geolocation=()"
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: beaverhabits
  namespace: beaverhabits
spec:
  parentRefs:
    - name: homelab
      namespace: gateway
  hostnames:
    - beaverhabits.leotsgo.dev
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: beaverhabits-security-headers
      backendRefs:
        - name: beaverhabits
          port: 8080
