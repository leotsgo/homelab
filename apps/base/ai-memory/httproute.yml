apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ai-memory-security-headers
  namespace: ai
spec:
  headers:
    browserXssFilter: true
    contentTypeNosniff: true
    forceSTSHeader: true
    stsIncludeSubdomains: true
    stsPreload: true
    stsSeconds: 31536000
    customFrameOptionsValue: "SAMEORIGIN"
    referrerPolicy: "strict-origin-when-cross-origin"
    permissionsPolicy: "camera=(), microphone=(), geolocation=()"
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ai-memory
  namespace: ai
spec:
  parentRefs:
    - name: homelab
      namespace: gateway
  hostnames:
    - aimemory.leotsgo.dev
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: ai-memory-security-headers
      backendRefs:
        - name: ai-memory
          port: 49374
