apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-memory
  namespace: ai
  labels:
    app: ai-memory
spec:
  replicas: 1
  strategy:
    type: Recreate
    # Explicit null: clears the rollingUpdate{maxSurge,maxUnavailable} block left
    # in the live object by RollingUpdate defaults. The API rejects a Deployment
    # with type Recreate together with a rollingUpdate block (Flux SSA dry-run
    # failure observed 2026-10-04).
    rollingUpdate: null
  selector:
    matchLabels:
      app: ai-memory
  template:
    metadata:
      labels:
        app: ai-memory
    spec:
      containers:
        - name: ai-memory
          image: akitaonrails/ai-memory:2.6.1
          # args REPLACE the image CMD (cli.rs requires a subcommand; serve
          # transport defaults to stdio which dies on stdin EOF) — spell out
          # the full serve invocation. Image ENTRYPOINT is the ai-memory binary.
          args:
            - serve
            - --transport
            - http
            - --bind
            - 0.0.0.0:49374
            - --enable-web
          env:
            - name: AI_MEMORY_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ai-memory-secrets
                  key: AUTH_TOKEN
            - name: AI_MEMORY_LLM_PROVIDER
              value: openai-compat
            - name: AI_MEMORY_LLM_BASE_URL
              # In-cluster service, NOT litellm.leotsgo.dev: the .dev name resolves
              # (pod-path DNS verified) to the node LAN IP, forcing a hairpin
              # pod -> LAN -> ingress back into the same namespace. From inside the
              # pod that path never connected (llm provider error since pod start,
              # 2026-10-04); ClusterIP svc is ~6ms away and always routes.
              value: http://litellm.ai.svc.cluster.local:4000/v1
            - name: AI_MEMORY_LLM_MODEL
              value: glm-5.3-flash
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-memory-secrets
                  key: LITELLM_API_KEY
            - name: AI_MEMORY_ALLOWED_HOSTS
              value: aimemory.leotsgo.dev,localhost,127.0.0.1,ai-memory.ai.svc.cluster.local
            - name: AI_MEMORY_AUTH__SECURE_COOKIE
              value: "true"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          ports:
            - containerPort: 49374
          readinessProbe:
            tcpSocket:
              port: 49374
            initialDelaySeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ai-memory-data
