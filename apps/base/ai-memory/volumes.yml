apiVersion: v1
kind: PersistentVolume
metadata:
  name: ai-memory-data
  namespace: ai
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ai-memory
  hostPath:
    path: /var/data/ai-memory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ai-memory-data
  namespace: ai
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: ai-memory
  volumeName: ai-memory-data
