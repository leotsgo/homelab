apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: ai
data:
  config.yaml: |
    model_list: []
    # Models are DB-managed (store_model_in_db: true) — add/edit via the UI
    # (https://litellm.leotsgo.dev/ui, master key in Vaultwarden item
    # `litellm-secrets`) or POST /model/new. The DB (CNPG `litellm` database,
    # barman→B2 backups) is the source of truth; keep this list EMPTY so config
    # and DB don't shadow each other. Bootstrap note: with an empty model_list
    # a fresh DB restore is required to serve traffic (acceptable: backups exist).

    litellm_settings:
      drop_params: true

    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      store_model_in_db: true
      database_url: os.environ/DATABASE_URL
