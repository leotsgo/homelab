apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: ai
data:
  config.yaml: |
    model_list:
      - model_name: glm-5.3-flash
        litellm_params:
          model: openai/commandcode/glm-5.3-flash
          api_base: https://api.commandcode.ai/provider/v1
          api_key: os.environ/CMD_API_KEY
      - model_name: default
        litellm_params:
          model: openai/commandcode/glm-5.3-flash
          api_base: https://api.commandcode.ai/provider/v1
          api_key: os.environ/CMD_API_KEY

    litellm_settings:
      drop_params: true

    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      store_model_in_db: true
      database_url: os.environ/DATABASE_URL
