apiVersion: apps/v1
kind: Deployment
metadata:
  name: yana
  namespace: yana
  labels:
    app: yana
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: yana
  template:
    metadata:
      labels:
        app: yana
    spec:
      containers:
        - name: yana
          # Fork build (branch `development`, merged feat/settings +
          # feat/default-dir + POST->PUT fix): per-folder sort via
          # .settings.yml, space-level daily-note override, default new-note
          # folder. Pinned by digest because branch tags float and kubelet
          # caches tag->digest. Rollback: flip back to the upstream digest
          # recorded 2026-09-21 below.
          # Upstream digest: ghcr.io/madeofpendletonwool/yana@sha256:26abb88fde88f7e8f2ab764ac45e859aad7e8adbe7f8619e6c97f1cf8b18df16
          image: ghcr.io/leotsgo/yana@sha256:473b72c03f9d3c8de6663c541f90a74af13c64066f3ac765cbbfd83e2b9918f3
          envFrom:
            - configMapRef:
                name: yana-config
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 8081
              name: content
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /notes
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: yana-data
