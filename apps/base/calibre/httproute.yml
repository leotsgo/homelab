apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: calibre-security-headers
  namespace: calibre
spec:
  headers:
    browserXssFilter: true
    contentTypeNosniff: true
    forceSTSHeader: true
    stsIncludeSubdomains: true
    stsPreload: true
    stsSeconds: 31536000
    customFrameOptionsValue: "SAMEORIGIN"
    contentSecurityPolicy: "default-src 'self'; script-src 'self'"
    referrerPolicy: "strict-origin-when-cross-origin"
    permissionsPolicy: "camera=(), microphone=(), geolocation=()"
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: calibre
  namespace: calibre
spec:
  parentRefs:
    - name: homelab
      namespace: gateway
  hostnames:
    - calibre.leotsgo.dev
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: calibre-security-headers
      backendRefs:
        - name: calibre
          port: 8083
