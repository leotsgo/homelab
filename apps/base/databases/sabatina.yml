# Sabatina (ns sabatina, repo leotsgo/resume-app). The role is declared under cluster.yml
# spec.managed.roles with its Vaultwarden-synced password; the database is declared here (CNPG
# Database CRD) and owned by it. The app reaches the cluster through
# homelab-rw.databases.svc.cluster.local:5432 with sslmode=require.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: sabatina
  namespace: databases
spec:
  cluster:
    name: homelab
  name: sabatina
  owner: sabatina
