apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich
  namespace: databases
spec:
  instances: 1
  # VectorChord (Immich smart-search requirement). Community image's tags
  # (pg17-v1.1.1) fail CNPG's admission webhook (needs a pg-major-parsable
  # tag), so: thin build on ghcr.io/cloudnative-pg/postgresql:17-bookworm +
  # VectorChord 1.1.1 .deb (needs glibc>=2.35 → bookworm, not bullseye).
  # Dockerfile lives in homelab-network scratch; rebuild: apt install of
  # https://github.com/tensorchord/VectorChord/releases/download/1.1.1/postgresql-17-vchord_1.1.1-1_amd64.deb
  imageName: ghcr.io/leotsgo/cnpg-vchord:17

  storage:
    size: 20Gi

  resources:
    requests:
      memory: 512Mi
      cpu: 100m
    limits:
      memory: 2Gi
      cpu: "2000m"

  postgresql:
    # vchord (VectorChord) refuses to CREATE EXTENSION without being preloaded.
    shared_preload_libraries:
      - vchord

  bootstrap:
    initdb:
      database: immich
      owner: immich
      postInitApplicationSQL:
        # vchord requires shared_preload_libraries (set above); CASCADE pulls in
        # its pgvector dependency. cube+earthdistance are Immich requirements
        # that need superuser — created here as postgres since the app role
        # must be able to manage them (Immich's docs make the app user a
        # superuser; we instead pre-create the extensions and keep the role
        # unprivileged for everything else).
        - CREATE EXTENSION IF NOT EXISTS vchord CASCADE;
        - CREATE EXTENSION IF NOT EXISTS vector;
        - CREATE EXTENSION IF NOT EXISTS cube;
        - CREATE EXTENSION IF NOT EXISTS earthdistance;
        - GRANT ALL ON SCHEMA public TO immich;

  monitoring:
    enablePodMonitor: false

  backup:
    barmanObjectStore:
      destinationPath: s3://leotsgo-data/immich-db
      endpointURL: https://s3.us-east-005.backblazeb2.com
      s3Credentials:
        accessKeyId:
          name: b2
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: b2
          key: ACCESS_SECRET_KEY
      wal:
        compression: gzip
      data:
        compression: gzip
    retentionPolicy: "14d"

  # Enforce the immich owner-role password against the Vaultwarden-synced
  # secret databases/immich-db-secret (key `password`, also synced into ns
  # immich for the app). Without this, CNPG re-syncs the role password to its
  # generated `immich-app` secret on every full reconcile (e.g. operator
  # restart), reverting any manual `ALTER ROLE` and crashlooping the app on
  # its next pod roll. Same model as the homelab cluster roles above.
  # NOTE: the Vaultwarden item `immich-db-secret` must exist BEFORE this
  # reconciles (fields: `password`, `url`; namespaces: databases, immich).
  # ponytail: role is declared superuser=true (Immich creates extensions like
  # earthdistance at startup; pre-creating them in initdb covers fresh boots
  # but future Immich versions may add more — superuser is the upgrade-safe
  # choice; tighten back to false if Immich ever stops needing it).
  managed:
    roles:
      - name: immich
        ensure: present
        login: true
        superuser: true
        createdb: false
        createrole: false
        inherit: true
        replication: false
        bypassrls: false
        connectionLimit: -1
        passwordSecret:
          name: immich-db-secret
