apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: homelab
  namespace: databases
spec:
  instances: 1
  imageName: ghcr.io/leotsgo/cnpg-pgvector:18

  storage:
    size: 5Gi

  resources:
    requests:
      memory: 256Mi
      cpu: 50m
    limits:
      memory: 1Gi
      cpu: 1000m

  enableSuperuserAccess: true

  bootstrap:
    initdb:
      database: bookorbit
      owner: bookorbit
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS vector;
        - CREATE EXTENSION IF NOT EXISTS pg_trgm;
        - CREATE EXTENSION IF NOT EXISTS "uuid-ossp";

  backup:
    barmanObjectStore:
      destinationPath: s3://leotsgo-data/homelab-db
      endpointURL: https://s3.us-east-005.backblazeb2.com
      s3Credentials:
        accessKeyId:
          name: b2
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: b2
          key: ACCESS_SECRET_KEY
      wal:
        compression: gzip
      data:
        compression: gzip
    retentionPolicy: "14d"

  # Enforce the bookorbit owner-role password against the Vaultwarden-synced
  # secret databases/bookorbit-db-secret (key `password`). Without this, CNPG
  # re-syncs the role password to its generated `homelab-app` secret on every
  # full reconcile (e.g. operator restart), reverting any manual `ALTER ROLE`
  # and crashlooping the app on its next pod roll. Attributes below mirror the
  # live role exactly so declaring it here revokes nothing.
  managed:
    roles:
      - name: bookorbit
        ensure: present
        login: true
        superuser: false
        createdb: false
        createrole: false
        inherit: true
        replication: false
        bypassrls: false
        connectionLimit: -1
        passwordSecret:
          name: bookorbit-db-secret
      # Migrated from the standalone wallabag-cluster into this shared cluster.
      # App reads its password from wallabag-container-env key
      # SYMFONY__ENV__DATABASE_PASSWORD (envFrom); the `password` key on the same
      # Vaultwarden-synced secret is the copy CNPG enforces here.
      - name: wallabag
        ensure: present
        login: true
        superuser: false
        createdb: false
        createrole: false
        inherit: true
        replication: false
        bypassrls: false
        connectionLimit: -1
        passwordSecret:
          name: wallabag-container-env
      # Migrated from the standalone nextcloud-cluster. App + role share the
      # Vaultwarden-synced nextcloud-db-secret (basic-auth), synced into both
      # nextcloud ns (app) and databases ns (this role).
      - name: nextcloud
        ensure: present
        login: true
        superuser: false
        createdb: false
        createrole: false
        inherit: true
        replication: false
        bypassrls: false
        connectionLimit: -1
        passwordSecret:
          name: nextcloud-db-secret
      # Migrated from the standalone paperless-cluster. Same shared-secret model.
      - name: paperless
        ensure: present
        login: true
        superuser: false
        createdb: false
        createrole: false
        inherit: true
        replication: false
        bypassrls: false
        connectionLimit: -1
        passwordSecret:
          name: paperless-db-secret
