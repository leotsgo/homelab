apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-server
  namespace: immich
  labels:
    app: immich-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immich-server
  template:
    metadata:
      labels:
        app: immich-server
      annotations:
        # Metrics: v3.x serves Prometheus on separate ports. API+microservices
        # listeners are enabled with IMMICH_TELEMETRY_INCLUDE (IMMICH_METRICS
        # is not a recognized var). Scraped by the Alloy pod-annotation rule.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: immich-server
          image: ghcr.io/immich-app/immich-server:v3.1.0
          env:
            - name: TZ
              value: "America/Sao_Paulo"
            # v3.x telemetry switch; covers API + microservices metric servers.
            - name: IMMICH_TELEMETRY_INCLUDE
              value: "all"
            # API metrics listen port (default 8081); microservices follow as 8082.
            - name: IMMICH_API_METRICS_PORT
              value: "8081"
            - name: DB_HOSTNAME
              value: "immich-rw.databases.svc.cluster.local"
            - name: DB_PORT
              value: "5432"
            - name: DB_USERNAME
              value: "immich"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  # Shared with the CNPG role: one Vaultwarden item syncs
                  # immich-db-secret into this ns (app) and databases
                  # (cluster managed.role). Rotate the password in one place.
                  name: immich-db-secret
                  key: password
            - name: DB_DATABASE_NAME
              value: "immich"
            - name: REDIS_HOSTNAME
              value: "valkey.databases.svc.cluster.local"
            - name: REDIS_PORT
              value: "6379"
            # ML worker URL. The var was removed after v1.x (configured in the
            # admin UI, default http://immich-machine-learning:3003) — set here
            # only as belt-and-braces; harmless if ignored. Same ns, same port.
            # NOTE: ML_ENABLED is NOT set — the server container runs both the
            # API and the microservices worker, so ML must stay enabled.
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              # API + microservices + ffmpeg transcode share this container;
              # 2Gi OOMKilled during a photo batch with video transcoding.
              memory: "4Gi"
              cpu: "2000m"
          ports:
            - containerPort: 2283
          readinessProbe:
            httpGet:
              path: /api/server/ping
              port: 2283
            initialDelaySeconds: 30
          livenessProbe:
            httpGet:
              path: /api/server/ping
              port: 2283
            initialDelaySeconds: 60
          volumeMounts:
            - name: upload
              # v3.x media root is /data (was /usr/src/app/upload pre-v2). The
              # PV must be here or uploads land on the container layer and
              # die with the pod.
              mountPath: /data
      volumes:
        - name: upload
          persistentVolumeClaim:
            claimName: immich-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-machine-learning
  namespace: immich
  labels:
    app: immich-machine-learning
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immich-machine-learning
  template:
    metadata:
      labels:
        app: immich-machine-learning
      annotations:
        # ML container has no Prometheus endpoint at all (v3.1.0) — no scrape.
        # Annotation removed; keep the pod un-annotated so Alloy skips it.
    spec:
      containers:
        - name: immich-machine-learning
          image: ghcr.io/immich-app/immich-machine-learning:v3.1.0
          env:
            - name: TZ
              value: "America/Sao_Paulo"
            - name: IMMICH_PORT
              value: "3003"
            - name: IMMICH_HOST
              value: "0.0.0.0"
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
          ports:
            - containerPort: 3003
          readinessProbe:
            httpGet:
              path: /ping
              port: 3003
            initialDelaySeconds: 30
          volumeMounts:
            - name: cache
              mountPath: /cache
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: immich-ml-cache
