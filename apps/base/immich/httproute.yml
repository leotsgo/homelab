# Gateway API HTTPRoute for Immich. Same model as bookorbit: a Middleware with the
# house security-header set (contentSecurityPolicy deliberately OMITTED — Immich's UI
# loads scripts/styles dynamically and breaks under a restrictive CSP), attached to the
# shared gateway/homelab Gateway. TLS is the gateway's wildcard *.leotsgo.dev cert.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: immich-security-headers
  namespace: immich
spec:
  headers:
    browserXssFilter: true
    contentTypeNosniff: true
    forceSTSHeader: true
    stsIncludeSubdomains: true
    stsPreload: true
    stsSeconds: 31536000
    customFrameOptionsValue: "SAMEORIGIN"
    referrerPolicy: "strict-origin-when-cross-origin"
    permissionsPolicy: "camera=(), microphone=(), geolocation=()"
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: immich
  namespace: immich
spec:
  parentRefs:
    - name: homelab
      namespace: gateway
  hostnames:
    - immich.leotsgo.dev
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: immich-security-headers
      backendRefs:
        - name: immich-server
          port: 2283
