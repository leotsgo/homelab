apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vaultwarden-kubernetes-secrets
  namespace: vaultwarden-kubernetes-secrets
spec:
  interval: 30m
  releaseName: vaultwarden-kubernetes-secrets
  chart:
    spec:
      chart: vaultwarden-kubernetes-secrets
      version: "2.2.0"
      sourceRef:
        kind: HelmRepository
        name: vaultwarden-kubernetes-secrets
        namespace: vaultwarden-kubernetes-secrets
  install:
    createNamespace: false
  values:
    env:
      config:
        VAULTWARDEN__SERVERURL: "https://vault.leotsgo.dev"
        SYNC__SYNCINTERVALSECONDS: "300"
        # v2.1.0 can't decrypt items carrying a per-item cipher key (what
        # recent Bitwarden clients write on edit): such an item drops out of
        # the source list and orphan cleanup DELETED its Secret
        # (ai/litellm-secrets, 2026-11-06). Undecryptable items now just
        # stop updating; stale Secrets need manual `kubectl delete`.
        SYNC__DELETEORPHANS: "false"
