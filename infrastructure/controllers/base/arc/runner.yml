# The classic self-hosted runner for the game repo: one pod, dind sidecar,
# self-registration from the Vaultwarden-synced arc-github-token PAT (key
# github_token; classic, repo scope). It registers with the label self-hosted —
# the one the workflows pin with runs-on. --replace re-registers over the
# stale entry GitHub keeps under this pod's name once the container is wiped
# (config.sh remove can't see that entry, it lives server-side). ARC's message
# broker never delivered jobs to a scale set here, so the plain registration won.
apiVersion: v1
kind: Namespace
metadata:
  name: arc-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hopwing-runner
  namespace: arc-system
  labels:
    app: hopwing-runner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hopwing-runner
  template:
    metadata:
      labels:
        app: hopwing-runner
    spec:
      # fsGroup hands every container the gid 123: the one dockerd chowns the
      # socket to, so the runner user reaches /var/run/docker.sock.
      securityContext:
        fsGroup: 123
      volumes:
        - name: work
          emptyDir: {}
        - name: dind-sock
          emptyDir: {}
      containers:
        - name: runner
          image: ghcr.io/actions/actions-runner:2.338.2
          command:
            - /bin/sh
            - -c
            - |
              # ponytail: --replace only cleanups the SAME pod-name entry; renamed
              # pods leave offline ancestors behind — sweep by hand on the runners
              # page if they accumulate.
              TOKEN=$(curl -fsSL -X POST \
                -H "Authorization: Bearer $github_token" \
                -H "Accept: application/vnd.github+json" \
                https://api.github.com/repos/hopwing/undefined-game/actions/runners/registration-token \
                | grep -o '"token": *"[^"]*"' | sed 's/.*: *"//; s/"//')
              [ -n "$TOKEN" ] || { echo "no registration token"; exit 1; }
              ./config.sh --url https://github.com/hopwing/undefined-game --token "$TOKEN" \
                --labels self-hosted --unattended --replace
              exec ./run.sh
          envFrom:
            - secretRef:
                name: arc-github-token
          env:
            - name: DOCKER_HOST
              value: unix:///var/run/docker.sock
            - name: RUNNER_WAIT_FOR_DOCKER_IN_SECONDS
              value: "120"
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 2Gi
              cpu: "2000m"
          volumeMounts:
            - name: work
              mountPath: /home/runner/_work
            - name: dind-sock
              mountPath: /var/run
        - name: dind
          image: docker:29-dind
          # --mtu matches the pod network (1450 on k3s VXLAN); without it the
          # docker0 bridge defaults to 1500 and large TLS handshakes to ghcr.io
          # die inside the bridge.
          args: ["dockerd", "--host=unix:///var/run/docker.sock", "--group=123", "--mtu=1450"]
          securityContext:
            privileged: true
          restartPolicy: Always
          resources:
            requests:
              memory: 256Mi
              cpu: 50m
            limits:
              memory: 1Gi
              cpu: "1000m"
          volumeMounts:
            - name: work
              mountPath: /home/runner/_work
            - name: dind-sock
              mountPath: /var/run
