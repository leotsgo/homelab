apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gha-runner-scale-set-controller
  namespace: arc-system
spec:
  interval: 30m
  releaseName: arc
  install:
    # The controller chart ships its CRDs in crds/; Flux's default skips them.
    crds: Create
  chart:
    spec:
      chart: gha-runner-scale-set-controller
      version: "0.15.0"
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller
        namespace: arc-system
