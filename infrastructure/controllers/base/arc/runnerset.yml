# The self-hosted runners for hopwing/undefined-game. The release name (hopwing)
# is the label the workflows pin with runs-on: [self-hosted, hopwing]. The
# GitHub token never lives in git: the Vaultwarden-synced secret arc-github-token
# (key github_token; a classic PAT with the repo scope) is referenced by name.
# Docker jobs (image builds, the CI services) run on docker-in-docker.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hopwing-runners
  namespace: arc-system
spec:
  interval: 30m
  releaseName: hopwing
  dependsOn:
    - name: gha-runner-scale-set-controller
  chart:
    spec:
      chart: gha-runner-scale-set
      version: "0.15.0"
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller
        namespace: arc-system
  values:
    githubConfigUrl: https://github.com/hopwing/undefined-game
    githubConfigSecret: arc-github-token
    # The labels the runners register with; jobs match on them. Empty, no job
    # ever matches (the runner does not add self-hosted on its own here).
    scaleSetLabels: ["self-hosted", "Linux", "X64"]
    containerMode:
      type: dind
    maxRunners: 1
    # One warm runner: the message broker never delivers job messages to this
    # scale set, so a 0-idle scale set would never wake up.
    minRunners: 1
