# The self-hosted runners for VSSSP/undefined-game. The release name (hopwing)
# is the label the workflows pin with runs-on: [self-hosted, hopwing]. The
# GitHub token never lives in git: the Vaultwarden-synced secret arc-github-token
# (key github_token; a classic PAT with the repo scope) is referenced by name.
# Docker jobs (image builds, the CI services) run on docker-in-docker.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hopwing-runners
  namespace: arc-system
spec:
  interval: 30m
  releaseName: hopwing
  dependsOn:
    - name: gha-runner-scale-set-controller
  chart:
    spec:
      chart: gha-runner-scale-set
      version: "0.15.0"
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller
        namespace: arc-system
  values:
    githubConfigUrl: https://github.com/VSSSP/undefined-game
    githubConfigSecret: arc-github-token
    containerMode:
      type: dind
    maxRunners: 1
    minRunners: 0
